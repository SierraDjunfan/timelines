<script>setTimeout(()=>{state.glossary??=[];const button=document.createElement('button');button.className='quiet';button.type='button';button.textContent='Glossary';document.querySelector('header .actions').append(button);const glossary=document.createElement('dialog');glossary.className='glossary-dialog';glossary.innerHTML='<form method="dialog"><div class="dialog-heading glossary-head"><h2>Glossary</h2><button class="close" value="cancel" type="submit" aria-label="Close">×</button></div><div class="glossary-tools"><input id="term-search" type="search" placeholder="Search terms"><button id="add-term" type="button">New term</button></div><section id="term-list" class="term-list"></section></form>';const editor=document.createElement('dialog');editor.className='term-dialog';editor.innerHTML='<form id="term-form" method="dialog"><div class="dialog-heading"><h2>New term</h2><button class="close" value="cancel" type="submit" aria-label="Close">×</button></div><label>Term <input id="term-name" required maxlength="120"></label><label>Description <textarea id="term-description" rows="6" required maxlength="2000"></textarea></label><div class="dialog-actions"><span></span><button value="cancel" type="submit" class="quiet">Cancel</button><button type="submit">Add term</button></div></form>';document.body.append(glossary,editor);const search=by('term-search'),list=by('term-list');function renderGlossary(){const query=search.value.trim().toLocaleLowerCase(),terms=state.glossary.filter(item=>item.term.toLocaleLowerCase().includes(query)||item.description.toLocaleLowerCase().includes(query)).sort((a,b)=>a.term.localeCompare(b.term));list.replaceChildren();let letter='';terms.forEach(item=>{const initial=item.term.charAt(0).toLocaleUpperCase();if(initial!==letter){letter=initial;const heading=document.createElement('h3');heading.className='term-letter';heading.textContent=letter;list.append(heading)}const entry=document.createElement('article');entry.className='term-entry';const <script>setTimeout(()=>{const name=document.querySelector('h1'),showName=()=>name.textContent=state.title;showName();name.ondblclick=()=>{name.contentEditable='true';name.focus();const range=document.createRange();range.selectNodeContents(name);getSelection().removeAllRanges();getSelection().addRange(range)};name.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();name.blur()}if(e.key==='Escape'){name.textContent=state.title;name.blur()}};name.onblur=()=>{state.title=name.textContent.trim()||'Untitled timeline';name.contentEditable='false';showName()};by('save').onclick=()=>{const slug=state.title.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'timeline',url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),link=Object.assign(document.createElement('a'),{href:url,download:`${slug}.json`});link.click();setTimeout(()=>URL.revokeObjectURL(url),0)};by('load').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Number.isInteger(x.start)||!Number.isInteger(x.end)||x.end<x.start||!Array.isArray(x.cards))throw 0;state.title=typeof x.title==='string'&&x.title.trim()?x.title.trim():'Untitled timeline';state.start=x.start;state.end=x.end;state.cards=x.cards.filter(c=>c&&typeof c.title==='string'&&Number.isInteger(c.year)).map(c=>({id:c.id||crypto.randomUUID(),title:c.title,description:String(c.description||''),year:Math.max(x.start,Math.min(x.end,c.year)),month:Number.isInteger(c.month)&&c.month>0&&c.month<13?c.month:1,day:Number.isInteger(c.day)&&c.day>0&&c.day<32?c.day:1}));showName();render()}catch{alert('That file is not a valid timeline.')}e.target.value=''}},25)</script>

function edit(card){by('form-title').textContent=card?'Edit card':'New card';by('id').value=card?.id||'';by('title').value=card?.title||'';by('description').value=card?.description||'';by('delete').hidden=!card;dialog.showModal();by('title').focus()}
